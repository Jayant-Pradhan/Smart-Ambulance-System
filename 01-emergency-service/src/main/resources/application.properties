spring.application.name=01-emergency-service


# Server Configuration
server.port=8081


# MySQL Database Configuration
#spring.datasource.url=jdbc:mysql://localhost:3306/smart_ambulance_system
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/smart_ambulance_system
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
#spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.bootstrap-servers=kafka:29092

# Kafka Producer - JSON Serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# eureka service connection
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

